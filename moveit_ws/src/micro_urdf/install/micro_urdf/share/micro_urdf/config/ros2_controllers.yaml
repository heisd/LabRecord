# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    micro_ros_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    hand:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

micro_ros_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
    command_interfaces:
      []
    state_interfaces:
      []
hand:
  ros__parameters:
    joints:
      - joint_5
    command_interfaces:
      []
    state_interfaces:
      []